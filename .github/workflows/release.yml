name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # OpenTUI ships a per-platform native core, so each target must build
        # on its own OS (cross-compiling from one host fails to resolve the
        # platform package — failing targets drop to bunx only).
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: git-reap-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: git-reap-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: git-reap-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            artifact: git-reap-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Compile
        id: compile
        continue-on-error: true
        run: |
          bun build --compile --target ${{ matrix.target }} src/bin.js \
            --outfile dist/${{ matrix.artifact }}
        shell: bash
      - name: Checksum
        if: steps.compile.outcome == 'success'
        run: |
          if command -v sha256sum >/dev/null; then sha256sum dist/${{ matrix.artifact }} > dist/${{ matrix.artifact }}.sha256
          else shasum -a 256 dist/${{ matrix.artifact }} > dist/${{ matrix.artifact }}.sha256; fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Aggregate checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS 2>/dev/null || true
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
